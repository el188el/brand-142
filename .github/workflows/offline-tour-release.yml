name: Build offline tour download

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-tour-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and verify portable tour
        run: |
          python3 scripts/build_tour_offline.py --zip "$RUNNER_TEMP/school142-tour-offline.zip"
          git diff --exit-code -- tour/index.html tour/offline-manifest.json tour/fonts
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          archive = Path(os.environ['RUNNER_TEMP']) / 'school142-tour-offline.zip'
          with zipfile.ZipFile(archive) as zipped:
              assert zipped.testzip() is None, 'ZIP integrity check failed'
          print('ZIP integrity verified.')
          PY
          cd "$RUNNER_TEMP"
          sha256sum school142-tour-offline.zip > school142-tour-offline.zip.sha256
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view school-tour-offline-v1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create school-tour-offline-v1 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title 'Виртуальный тур — офлайн-версия' --notes 'Все 51 панорама для работы без интернета. Распакуйте ZIP; для запуска нужен Python 3. Инструкция находится внутри архива.'
          fi
          gh release upload school-tour-offline-v1 "$RUNNER_TEMP/school142-tour-offline.zip" "$RUNNER_TEMP/school142-tour-offline.zip.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit school-tour-offline-v1 --repo "$GITHUB_REPOSITORY" --draft=false --latest
